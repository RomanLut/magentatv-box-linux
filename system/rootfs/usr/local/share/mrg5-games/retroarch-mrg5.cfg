# Appended to RetroArch's own config by retro-run (--appendconfig).
# No menu_driver here: RetroArch saves appended options into its own retroarch.cfg on exit
# (config_save_on_exit), so a menu set here replaced the owner's menu for every later start.
# The menu is RetroArch's own setting: XMB, Debian's default (retroarch-assets is installed).
audio_driver = "pulse"
video_fullscreen = "true"
# The panel runs at 50 Hz only. Pace by audio, not by vsync, so 60 Hz (NTSC)
# games run at their real speed instead of 50/60 of it; PAL games match anyway.
video_vsync = "false"
audio_sync = "true"
input_joypad_driver = "udev"
# no ALSA sequencer on this kernel; the default driver only logs errors
midi_driver = "null"
system_directory = "/DATA/Games/bios"
rgui_browser_directory = "/DATA/Games"
# No keyboard volume hotkeys (owner, 2026-10-04): RetroArch's defaults, keypad + and -, change
# RetroArch's own volume up to +12 dB on top of the system's, and the MagentaTV remote's EPG key
# raised it. Volume is the system's, set with the remote's volume keys; RetroArch's own starts at
# 0 dB every time, so a raised value saved on exit does not stick.
input_volume_up = "nul"
input_volume_down = "nul"
audio_volume = "0.000000"
