# Only warnings and worse on the kernel consoles once the system is up
# (checks/34). Every console message is written to ttyS0 at 115200 baud with
# interrupts off, and that long enough to overrun the Bluetooth UART's 32-byte
# FIFO at 1.5 Mbaud: Docker's veth messages at boot corrupted the H5 link and
# stopped LE reception. dmesg still keeps every message; the kernel command
# line (loglevel=8 ignore_loglevel) still prints the whole boot.
kernel.printk = 4 4 1 7
