# /etc/systemd/system/bluetooth.service.d/mrg5-restart.conf (checks/34, "The remote control"):
# Debian's bluetooth.service has no Restart=. bluetoothd 5.66 has aborted with heap
# corruption ("realloc(): invalid next size") when the remote's bond was removed and when
# it was paired again; without a restart the remote stays dead until the next boot.
[Service]
Restart=on-failure
RestartSec=1
