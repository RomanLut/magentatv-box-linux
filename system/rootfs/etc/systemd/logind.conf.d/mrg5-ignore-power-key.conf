# /etc/systemd/logind.conf.d/mrg5-ignore-power-key.conf (checks/41, "Remote power button")
# logind watches every input device with keys, the MagentaTV remote and the Rapoo
# keyboard's System Control included, and by default powers off on KEY_POWER. This box has
# no power switch and no standby, so after a power-off only unplugging brings it back:
# ignore the power key (and a long press of it).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
