# Xorg for the MRG5 on our own KMS driver (card1 = mrg5, checks/53 §6).
#
# AccelMethod "msdri3" (Raspberry Pi's modesetting patch, work/xorg-msdri3/):
# X draws the desktop on the CPU, and GL clients render on the V3D GPU through
# DRI3 (Mesa's kmsro: render on /dev/dri/renderD128, scan out on card1).  This
# is Raspberry Pi's setup for the Pi 1-3, whose GPU, like V3D 3.3, cannot
# sample the linear screen: under glamor every copy from the screen needs a
# whole-screen conversion.  It needs the msdri3 build of modesetting_drv.so;
# Debian's module does not know "msdri3" and would run X unaccelerated
# without DRI3, so GL clients would lose the GPU.
# "glamor" still works with this file (the fixed Mesa renders it correctly).
#
# The alternative is 99-mrg5-fbdev.conf, kept beside this file: the unaccelerated
# fbdev driver on /dev/fb0, which needs the patched libshadow.so (checks/41).
# Exactly one of the two may be in this directory.
Section "Device"
    Identifier  "mrg5kms"
    Driver      "modesetting"
    Option      "kmsdev" "/dev/dri/card1"
    Option      "AccelMethod" "msdri3"
    # Page flips on (checks/53 open item 1): on the msdri3 desktop a full-screen
    # GL client is otherwise copied into the screen by the CPU from uncached
    # memory (~87 % of the X server's core, ~5 fps at 1080p).  Flips wedged the
    # SoC under glamor before the GPU fixes of checks/53 section 5.
    Option      "PageFlip" "true"
    # Draw into a cached shadow of the screen and copy only changed areas into
    # the uncached scanout buffer (checks/53 §6): reads of the screen - moving,
    # scrolling, GetImage - no longer run at uncached speed. Needs the msdri3
    # module with mrg5-msdri3-shadowfb.py (work/xorg-msdri3/build-msdri3.sh).
    Option      "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier  "mrg5screen"
    Device      "mrg5kms"
    DefaultDepth 24
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
EndSection
