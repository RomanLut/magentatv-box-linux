# checks/53: video on the MRG5 msdri3 desktop.  Software decode (no video
# decoder driver), V3D (GLES 3.0) converts and scales, and the full-screen
# window is page-flipped to the screen without a CPU copy.
vo=gpu
gpu-api=opengl
opengl-es=yes
hwdec=no
fs=yes
# H.264 is the cheapest codec for this CPU (codecbench.sh); 720p60 decodes with
# headroom, 1080p60 does not.
ytdl-format=bestvideo[vcodec^=avc1][height<=?720]+bestaudio/best[height<=?720]
